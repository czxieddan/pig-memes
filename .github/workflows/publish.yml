name: memehub index publication

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: memehub-index-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted pre-merge base code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check trusted automation syntax
        run: python -m compileall -q scripts
      - name: Publishing App token
        id: app
        if: vars.MEMEHUB_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MEMEHUB_APP_ID }}
          private-key: ${{ secrets.MEMEHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Fetch current default branch, validate all manifests, publish only index
        run: python -m memehub.cli publish
        env:
          MEMEHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
