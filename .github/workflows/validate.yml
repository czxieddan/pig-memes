name: memehub validation

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    paths-ignore:
      - manifest/index.toml

permissions: {}

concurrency:
  group: memehub-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == github.event.repository.default_branch) ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted base commit only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check trusted automation syntax
        run: python -m compileall -q scripts
      - name: Publishing App token for this repository
        id: app
        if: vars.MEMEHUB_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MEMEHUB_APP_ID }}
          private-key: ${{ secrets.MEMEHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
      - name: Publishing App token installed on head fork
        id: head-app
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          vars.MEMEHUB_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MEMEHUB_APP_ID }}
          private-key: ${{ secrets.MEMEHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.event.pull_request.head.repo.owner.login }}
          repositories: ${{ github.event.pull_request.head.repo.name }}
          permission-contents: write
          permission-statuses: write
      - name: Validate PR data and write manifests to its source branch
        if: github.event_name == 'pull_request_target'
        run: python -m memehub.cli validate
        env:
          MEMEHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          MEMEHUB_HEAD_TOKEN: ${{ steps.head-app.outputs.token }}
          MEMEHUB_PUBLISHER_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          MEMEHUB_BOT_LOGIN: ${{ vars.MEMEHUB_BOT_LOGIN }}
          MEMEHUB_ALLOW_MAINTAINER_IMPORT: ${{ vars.MEMEHUB_ALLOW_MAINTAINER_IMPORT || 'false' }}
      - name: Revalidate pending PRs after default branch changes
        if: github.event_name == 'push'
        run: python -m memehub.cli revalidate
        env:
          MEMEHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          MEMEHUB_PUBLISHER_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          MEMEHUB_BOT_LOGIN: ${{ vars.MEMEHUB_BOT_LOGIN }}
          MEMEHUB_ALLOW_MAINTAINER_IMPORT: ${{ vars.MEMEHUB_ALLOW_MAINTAINER_IMPORT || 'false' }}
